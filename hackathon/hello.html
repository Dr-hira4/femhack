<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two Column Layout</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 50px;
      gap: 40px;
    }

    .text-section {
      flex: 1;
      text-align: left;
    }

    .text-section h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .text-section p {
      font-size: 18px;
      color: #555;
      line-height: 1.6;
    }

    .image-section {
      flex: 1;
      text-align: right;
    }

    .image-section img {
      max-width: 100%;
      height: auto;
    }

    /* Responsive for small screens */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        text-align: center;
      }
      .text-section, .image-section {
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="text-section">
      <h1>Lessons and insights from 8 years</h1>
      <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Praesent commodo cursus magna, vel scelerisque nisl consectetur.</p>
    </div>
    <div class="image-section">
      <img src="Illustration.png" alt="Sample Image" width="300PX">
    </div>
  </div>

</body>
</html>
